[project]
name = "llm-platform"
version = "0.1.0"
description = "LLM gateway with privacy controls (PII masking, policy routing, audit)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "litellm>=1.50",
    "boto3>=1.35",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
